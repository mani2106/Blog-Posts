<script>
/* Keep the Utterances comment box in sync with Quarto's light/dark toggle.
   Utterances renders in a cross-origin utteranc.es iframe, so we can't style it
   directly — we postMessage a {type:'set-theme'} command into the frame.
   Quarto flips a `quarto-dark`/`quarto-light` class on <body> when the navbar
   toggle is clicked (see its generated toggleBodyColorMode), so we read that
   class as the authoritative light/dark state. We re-sync on clicks on
   .quarto-color-scheme-toggle, giving Quarto a tick to flip the class first. */
(function () {
  function darkMode() {
    // Quarto sets <body> to class quarto-dark|quarto-light; read it directly.
    // (Background-luminance probing was fragile — it lagged behind the CSS
    // transition after a toggle, leaving the box stuck on the old theme.)
    return document.body.classList.contains("quarto-dark");
  }
  function sync() {
    var f = document.querySelector("iframe.utterances-frame");
    if (f && f.contentWindow) {
      f.contentWindow.postMessage(
        { type: "set-theme", theme: darkMode() ? "github-dark" : "github-light" },
        "https://utteranc.es"
      );
    }
  }
  // Sync once the Utterances iframe is injected by client.js.
  if (document.body) {
    new MutationObserver(function (_, obs) {
      if (document.querySelector("iframe.utterances-frame")) { sync(); obs.disconnect(); }
    }).observe(document.body, { childList: true, subtree: true });
  }
  // Re-sync whenever the reader toggles the theme (give Quarto a tick to flip DOM).
  document.addEventListener("click", function (e) {
    if (e.target && e.target.closest && e.target.closest(".quarto-color-scheme-toggle")) {
      setTimeout(sync, 60);
    }
  });
})();
</script>
